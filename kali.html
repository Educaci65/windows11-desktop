<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kali RGB</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{height:100vh;background:#030308;background-image:
  radial-gradient(ellipse at 15% 30%,rgba(0,255,255,.09) 0%,transparent 50%),
  radial-gradient(ellipse at 85% 20%,rgba(255,0,255,.08) 0%,transparent 50%),
  radial-gradient(ellipse at 50% 90%,rgba(0,100,255,.06) 0%,transparent 50%);
  font-family:'Segoe UI',Consolas,monospace;display:flex;flex-direction:column;color:#e0e0e0;overflow:hidden}
#desktop{flex:1;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,92px);grid-auto-rows:96px;gap:8px;align-content:start;overflow-y:auto}
.sc{width:92px;text-align:center;cursor:pointer;padding:6px 3px;border-radius:10px;transition:all .18s}
.sc:hover{background:rgba(0,255,255,.1);transform:translateY(-3px);box-shadow:0 0 25px rgba(0,255,255,.25)}
.ic{width:44px;height:44px;margin:0 auto 5px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#030308;box-shadow:0 0 14px currentColor,0 4px 10px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15)}
.lb{font-size:10px;font-weight:500;color:#bbb;text-shadow:0 0 8px #000;line-height:1.15}
#bar{height:44px;background:rgba(5,5,12,.95);border-top:1px solid rgba(0,255,255,.25);display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 -5px 25px rgba(0,255,255,.1)}
#startBtn{height:32px;padding:0 16px;background:linear-gradient(135deg,rgba(0,255,255,.2),rgba(255,0,255,.15));border:1px solid #0ff;border-radius:6px;color:#0ff;font-weight:600;font-size:13px;cursor:pointer;font-family:Consolas,monospace;transition:all .15s}
#startBtn:hover{background:linear-gradient(135deg,#0ff,#f0f);color:#000;box-shadow:0 0 22px #0ff}
#clock{font-size:13px;color:#0ff;letter-spacing:1px}
#status{position:absolute;bottom:56px;left:14px;background:#000;color:#0f0;padding:8px 14px;font-size:12px;font-family:Consolas,monospace;border:1px solid #0f0;border-radius:6px;display:none;z-index:999;box-shadow:0 0 15px rgba(0,255,0,.3)}
#menu{position:absolute;bottom:50px;left:10px;width:290px;background:rgba(5,5,12,.97);border:1px solid rgba(0,255,255,.3);border-radius:10px;display:none;flex-direction:column;z-index:200;max-height:75vh;overflow-y:auto;box-shadow:0 0 40px rgba(0,255,255,.2)}
.mi{padding:9px 15px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:11px;color:#ccc;font-family:Consolas,monospace;transition:all .1s}
.mi:hover{background:rgba(0,255,255,.12);color:#0ff}
.mi i{width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#000}
.divider{height:1px;background:linear-gradient(90deg,transparent,#0ff,transparent);margin:5px 0}
#credit{position:absolute;bottom:52px;right:14px;font-size:11px;color:rgba(0,255,255,.45)}
</style>
</head>
<body>
<div id="desktop"></div>
<div id="status">root@kali:~# cargando...</div>
<div id="credit">hecho por Eduar</div>
<div id="bar">
  <button id="startBtn">root@kali</button>
  <div id="clock">00:00</div>
</div>
<div id="menu"></div>

const desk = document.getElementById('desktop');
const menu = document.getElementById('menu');

juegos.forEach(j => {
  const d = document.createElement('div');
  d.className = 'sc';
  d.onclick = () => abrir(j.id, j.n);
  d.innerHTML = `<div class="ic" style="background:${j.c}">${j.l}</div><div class="lb">${j.n}</div>`;
  desk.appendChild(d);

  const m = document.createElement('div');
  m.className = 'mi';
  m.onclick = () => abrir(j.id, j.n);
  m.innerHTML = `<i style="background:${j.c}">${j.l}</i> ${j.n}`;
  menu.appendChild(m);
});

menu.innerHTML += `
  <div class="divider"></div>
  <div class="mi" onclick="limpiezaTotal()">Limpieza (P)</div>
  <div class="mi" onclick="location.reload()">Reiniciar</div>
  <div class="mi" onclick="window.close()">Apagar</div>
`;

document.getElementById('startBtn').onclick = e => {
  e.stopPropagation();
  menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
};
document.body.onclick = () => menu.style.display = 'none';

document.addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P') {
    e.preventDefault();
    limpiezaTotal();
  }
});

setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}, 1000);

function abrir(id, title) {
  const s = document.getElementById('status');
  s.style.display = 'block';
  s.textContent = 'root@kali:~# cargando ' + title + '...';

  const base = id.startsWith('cl')
    ? 'https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/UGS-Files/'
    : 'https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/offline/';

  fetch(base + id + '.html')
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(html => {
      s.style.display = 'none';
      const g = window.open('about:blank', '_blank');
      if (g) {
        ventanasAbiertas.push(g);
        g.document.write(html);
        g.document.close();
      } else {
        s.style.display = 'block';
        s.textContent = 'root@kali:~# activa pop-ups';
        setTimeout(() => s.style.display = 'none', 2200);
      }
    })
    .catch(() => {
      s.textContent = 'root@kali:~# error: ' + title;
      setTimeout(() => s.style.display = 'none', 2200);
    });
}

function limpiezaTotal() {
  ventanasAbiertas.forEach(v => {
    try { if (v && !v.closed) v.close(); } catch(e) {}
  });
  ventanasAbiertas.length = 0;
  try { localStorage.clear(); } catch(e) {}
  try { sessionStorage.clear(); } catch(e) {}
  window.location.href = 'https://classroom.google.com';
}
