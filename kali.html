<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{height:100vh;background:#0f0f1a;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;color:#fff;overflow:hidden}
#header{padding:14px 18px;background:linear-gradient(90deg,#7c3aed,#2563eb);display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#header h1{font-size:20px;font-weight:700;letter-spacing:0.5px}
#header span{font-size:12px;opacity:.85}
#desktop{flex:1;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,100px);grid-auto-rows:110px;gap:12px;align-content:start;overflow-y:auto;background:#0f0f1a}
.sc{width:100px;text-align:center;cursor:pointer;padding:8px 4px;border-radius:14px;transition:all .18s;background:rgba(255,255,255,.03)}
.sc:hover{background:rgba(255,255,255,.1);transform:translateY(-4px);box-shadow:0 8px 25px rgba(0,0,0,.4)}
.ic{width:56px;height:56px;margin:0 auto 8px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.lb{font-size:12px;font-weight:500;color:#e2e8f0;line-height:1.2}
#bar{height:48px;background:#1a1a2e;border-top:1px solid #2d2d44;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
#startBtn{height:34px;padding:0 16px;background:linear-gradient(135deg,#7c3aed,#2563eb);border:none;border-radius:8px;color:#fff;font-weight:600;font-size:13px;cursor:pointer}
#startBtn:hover{filter:brightness(1.15)}
#clock{font-size:13px;color:#94a3b8}
#status{position:absolute;bottom:60px;left:16px;background:#000;color:#4ade80;padding:8px 14px;font-size:12px;font-family:Consolas,monospace;border-radius:8px;display:none;z-index:999}
#menu{position:absolute;bottom:56px;left:12px;width:280px;background:#1a1a2e;border:1px solid #2d2d44;border-radius:12px;display:none;flex-direction:column;z-index:200;max-height:70vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.mi{padding:10px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;color:#e2e8f0}
.mi:hover{background:rgba(124,58,237,.2)}
.mi i{width:24px;height:24px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.divider{height:1px;background:#2d2d44;margin:4px 0}
#credit{position:absolute;bottom:58px;right:16px;font-size:11px;color:rgba(255,255,255,.35)}
</style>
</head>
<body>
<div id="header">
  <h1>Petazah Games</h1>
  <span>hecho por Eduar</span>
</div>
<div id="desktop"></div>
<div id="status">Cargando...</div>
<div id="credit">hecho por Eduar</div>
<div id="bar">
  <button id="startBtn">Menu</button>
  <div id="clock">00:00</div>
</div>
<div id="menu"></div>

const desk = document.getElementById('desktop');
const menu = document.getElementById('menu');

juegos.forEach(j => {
  const d = document.createElement('div');
  d.className = 'sc';
  d.onclick = () => abrir(j.id, j.n);
  d.innerHTML = `<div class="ic" style="background:${j.c}">${j.l}</div><div class="lb">${j.n}</div>`;
  desk.appendChild(d);

  const m = document.createElement('div');
  m.className = 'mi';
  m.onclick = () => abrir(j.id, j.n);
  m.innerHTML = `<i style="background:${j.c}">${j.l}</i> ${j.n}`;
  menu.appendChild(m);
});

menu.innerHTML += `
  <div class="divider"></div>
  <div class="mi" onclick="limpiezaTotal()">Limpieza (P)</div>
  <div class="mi" onclick="location.reload()">Reiniciar</div>
  <div class="mi" onclick="window.close()">Cerrar</div>
`;

document.getElementById('startBtn').onclick = e => {
  e.stopPropagation();
  menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
};
document.body.onclick = () => menu.style.display = 'none';

document.addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P') {
    e.preventDefault();
    limpiezaTotal();
  }
});

setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}, 1000);

function abrir(id, title) {
  const s = document.getElementById('status');
  s.style.display = 'block';
  s.textContent = 'Cargando ' + title + '...';

  const base = id.startsWith('cl')
    ? 'https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/UGS-Files/'
    : 'https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/offline/';

  fetch(base + id + '.html')
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(html => {
      s.style.display = 'none';
      const g = window.open('about:blank', '_blank');
      if (g) {
        ventanasAbiertas.push(g);
        g.document.write(html);
        g.document.close();
      } else {
        s.style.display = 'block';
        s.textContent = 'Activa los pop-ups';
        setTimeout(() => s.style.display = 'none', 2200);
      }
    })
    .catch(() => {
      s.textContent = 'Error: ' + title;
      setTimeout(() => s.style.display = 'none', 2200);
    });
}

function limpiezaTotal() {
  ventanasAbiertas.forEach(v => {
    try { if (v && !v.closed) v.close(); } catch(e) {}
  });
  ventanasAbiertas.length = 0;
  try { localStorage.clear(); } catch(e) {}
  try { sessionStorage.clear(); } catch(e) {}
  window.location.href = 'https://classroom.google.com';
}
