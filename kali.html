<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kali Gamer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{height:100vh;background:#050508;background-image:
  radial-gradient(ellipse at 10% 20%,rgba(0,255,100,.07) 0%,transparent 50%),
  radial-gradient(ellipse at 90% 80%,rgba(0,150,255,.05) 0%,transparent 50%);
  font-family:'Segoe UI',Consolas,monospace;display:flex;flex-direction:column;color:#d0d0d0;overflow:hidden}
#desktop{flex:1;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,96px);grid-auto-rows:100px;gap:10px;align-content:start;overflow-y:auto}
.sc{width:96px;text-align:center;cursor:pointer;padding:8px 4px;border-radius:10px;transition:all .18s}
.sc:hover{background:rgba(0,255,100,.1);transform:translateY(-2px);box-shadow:0 0 25px rgba(0,255,100,.2)}
.ic{width:48px;height:48px;margin:0 auto 6px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#050508;box-shadow:0 0 14px currentColor,0 4px 12px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15)}
.lb{font-size:11px;font-weight:500;color:#aaa;text-shadow:0 0 8px #000;line-height:1.2}
#bar{height:44px;background:rgba(8,8,12,.95);border-top:1px solid rgba(0,255,100,.2);display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 -4px 20px rgba(0,255,100,.08)}
#startBtn{height:32px;padding:0 16px;background:linear-gradient(135deg,rgba(0,255,100,.15),rgba(0,150,255,.1));border:1px solid #00ff64;border-radius:6px;color:#00ff64;font-weight:600;font-size:13px;cursor:pointer;font-family:Consolas,monospace;transition:all .15s}
#startBtn:hover{background:#00ff64;color:#000;box-shadow:0 0 20px #00ff64}
#clock{font-size:13px;color:#00ff64;letter-spacing:1px}
#status{position:absolute;bottom:56px;left:14px;background:#000;color:#00ff64;padding:8px 14px;font-size:12px;font-family:Consolas,monospace;border:1px solid #00ff64;border-radius:6px;display:none;z-index:999;box-shadow:0 0 15px rgba(0,255,100,.3)}
#menu{position:absolute;bottom:50px;left:10px;width:290px;background:rgba(8,8,12,.97);border:1px solid rgba(0,255,100,.25);border-radius:10px;display:none;flex-direction:column;z-index:200;max-height:75vh;overflow-y:auto;box-shadow:0 0 40px rgba(0,255,100,.15)}
.mi{padding:10px 16px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:12px;color:#ccc;font-family:Consolas,monospace;transition:all .1s}
.mi:hover{background:rgba(0,255,100,.1);color:#00ff64}
.mi i{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#000}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(0,255,100,.3),transparent);margin:5px 0}
#credit{position:absolute;bottom:52px;right:14px;font-size:11px;color:rgba(0,255,100,.45);font-family:Consolas,monospace}
</style>
</head>
<body>
<div id="desktop"></div>
<div id="status">root@kali:~# cargando...</div>
<div id="credit">hecho por Eduar</div>
<div id="bar">
  <button id="startBtn">root@kali</button>
  <div id="clock">00:00</div>
</div>
<div id="menu"></div>

<script>
const ventanasAbiertas = [];

const juegos = [
  // Mejores graficos posibles
  {id:'cl2doom',n:'Doom',c:'#ff0033',l:'DM'},
  {id:'cl3dpinballspacecadet',n:'3D Pinball',c:'#00cc99',l:'PB'},
  {id:'cl3dash',n:'3Dash',c:'#00ff66',l:'3D'},
  {id:'motox3m',n:'Moto X3M',c:'#ff6600',l:'MX'},
  {id:'motox3m2',n:'Moto X3M 2',c:'#ff4400',l:'M2'},
  {id:'motox3mpoolparty',n:'Moto Pool',c:'#00b8d4',l:'MP'},
  {id:'hillclimbracinglite',n:'Hill Climb',c:'#0091ea',l:'HC'},
  {id:'awesometanks2',n:'Awesome Tanks',c:'#78909c',l:'AT'},
  {id:'cl2Dshooting',n:'2D Shooting',c:'#7c4dff',l:'2DS'},
  {id:'cl10bullets',n:'10 Bullets',c:'#ff1744',l:'10B'},
  {id:'cl1morebullets',n:'More Bullets',c:'#f50057',l:'MB'},
  {id:'cl100RoomsofEnemies',n:'100 Rooms',c:'#304ffe',l:'100R'},
  {id:'cl12minibattles',n:'12 Battles',c:'#ff3d00',l:'12'},
  {id:'cl13bones',n:'13 Bones',c:'#d500f9',l:'13'},

  // Populares limpios
  {id:'geometrydash',n:'Geometry Dash',c:'#00e676',l:'GD'},
  {id:'amongus',n:'Among Us',c:'#ff1744',l:'AU'},
  {id:'angrybirds',n:'Angry Birds',c:'#ff5252',l:'AB'},
  {id:'fruitninja',n:'Fruit Ninja',c:'#69f0ae',l:'FN'},
  {id:'fireboyandwatergirl2',n:'Fireboy',c:'#ff6e40',l:'FW'},
  {id:'candycrush',n:'Candy Crush',c:'#f50057',l:'CC'},
  {id:'basketbros',n:'Basket Bros',c:'#ffab00',l:'BB'},
  {id:'basketballstars',n:'Basket Stars',c:'#ff9100',l:'BS'},
  {id:'clADOFAI',n:'ADOFAI',c:'#e040fb',l:'ADF'},
  {id:'cl2048',n:'2048',c:'#ff9100',l:'48'},
  {id:'cl8ballpool',n:'8 Ball Pool',c:'#00e676',l:'8B'},
  {id:'clBTD1',n:'Bloons TD',c:'#a1887f',l:'BTD'},

  // Retro
  {id:'cl100in1nes',n:'100 NES',c:'#40c4ff',l:'100'},
  {id:'cl64in1nes',n:'64 NES',c:'#00b0ff',l:'64'},
  {id:'cl90in1nes',n:'90 NES',c:'#0091ea',l:'90'},
  {id:'cl1942nes',n:'1942',c:'#2979ff',l:'42'},

  // Otros
  {id:'ducklife',n:'Duck Life',c:'#1de9b6',l:'DL'},
  {id:'ducklife4',n:'Duck Life 4',c:'#00bfa5',l:'D4'},
  {id:'chess',n:'Chess',c:'#448aff',l:'CH'},
  {id:'learntofly',n:'Learn to Fly',c:'#00bfa5',l:'LF'},
  {id:'bobtherobber',n:'Bob Robber',c:'#b388ff',l:'BR'},
  {id:'breakingthebank',n:'Break Bank',c:'#ffd600',l:'BK'},
  {id:'escapingtheprison',n:'Escape Prison',c:'#ff4081',l:'EP'},
  {id:'badicecream',n:'Bad Ice Cream',c:'#40c4ff',l:'BI'},
  {id:'idlebreakout',n:'Idle Breakout',c:'#ffab00',l:'IB'},
  {id:'houseofhazards',n:'House Hazards',c:'#90a4ae',l:'HH'},
  {id:'circloO',n:'CircloO',c:'#536dfe',l:'CO'},
  {id:'cl3pandas',n:'3 Pandas',c:'#ffab00',l:'3P'},
  {id:'cl60secondsburgerrun',n:'Burger Run',c:'#ff6d00',l:'BRG'},
  {id:'cl8ballclassic',n:'8 Ball Classic',c:'#00c853',l:'8C'},
  {id:'cl10minutestildawn',n:'10 Minutes',c:'#aa00ff',l:'10M'}
];

const desk = document.getElementById('desktop');
const menu = document.getElementById('menu');

juegos.forEach(j => {
  const d = document.createElement('div');
  d.className = 'sc';
  d.onclick = () => abrir(j.id, j.n);
  d.innerHTML = `<div class="ic" style="background:${j.c}">${j.l}</div><div class="lb">${j.n}</div>`;
  desk.appendChild(d);

  const m = document.createElement('div');
  m.className = 'mi';
  m.onclick = () => abrir(j.id, j.n);
  m.innerHTML = `<i style="background:${j.c}">${j.l}</i> ${j.n}`;
  menu.appendChild(m);
});

menu.innerHTML += `
  <div class="divider"></div>
  <div class="mi" onclick="limpiezaTotal()">Limpieza (P)</div>
  <div class="mi" onclick="location.reload()">Reiniciar</div>
  <div class="mi" onclick="window.close()">Apagar</div>
`;

document.getElementById('startBtn').onclick = e => {
  e.stopPropagation();
  menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
};
document.body.onclick = () => menu.style.display = 'none';

document.addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P') {
    e.preventDefault();
    limpiezaTotal();
  }
});

setInterval(() => {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}, 1000);

function abrir(id, title) {
  const s = document.getElementById('status');
  s.style.display = 'block';
  s.textContent = 'root@kali:~# cargando ' + title + '...';

  const base = id.startsWith('cl')
    ? 'https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/UGS-Files/'
    : 'https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/offline/';

  fetch(base + id + '.html')
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(html => {
      s.style.display = 'none';
      const g = window.open('about:blank', '_blank');
      if (g) {
        ventanasAbiertas.push(g);
        g.document.write(html);
        g.document.close();
      } else {
        s.style.display = 'block';
        s.textContent = 'root@kali:~# activa pop-ups';
        setTimeout(() => s.style.display = 'none', 2200);
      }
    })
    .catch(() => {
      s.textContent = 'root@kali:~# error: ' + title;
      setTimeout(() => s.style.display = 'none', 2200);
    });
}

function limpiezaTotal() {
  ventanasAbiertas.forEach(v => {
    try { if (v && !v.closed) v.close(); } catch(e) {}
  });
  ventanasAbiertas.length = 0;
  try { localStorage.clear(); } catch(e) {}
  try { sessionStorage.clear(); } catch(e) {}
  window.location.href = 'https://classroom.google.com';
}
</script>
</body>
</html>
