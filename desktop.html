<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);font-family:Segoe UI,system-ui,sans-serif;display:flex;flex-direction:column;color:#fff;overflow:hidden}
#desktop{flex:1;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,90px);grid-auto-rows:95px;gap:8px;align-content:start}
.sc{width:90px;text-align:center;cursor:pointer;padding:6px 4px;border-radius:8px}
.sc:hover{background:rgba(255,255,255,.12)}
.ic{width:44px;height:44px;margin:0 auto 5px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;box-shadow:0 3px 6px rgba(0,0,0,.4)}
.lb{font-size:11px;font-weight:500;text-shadow:0 1px 2px #000}
#bar{height:46px;background:rgba(32,32,32,.92);display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid rgba(255,255,255,.08)}
#startBtn{height:32px;padding:0 12px;background:rgba(255,255,255,.1);border:none;border-radius:6px;color:#fff;font-weight:600;cursor:pointer}
#startBtn:hover{background:rgba(255,255,255,.18)}
#clock{font-size:13px}
#status{position:absolute;bottom:56px;left:14px;background:#000;color:#0f0;padding:7px 12px;font-size:12px;border-radius:6px;display:none;z-index:99}
#menu{position:absolute;bottom:52px;left:10px;width:250px;background:rgba(32,32,32,.96);border:1px solid rgba(255,255,255,.1);border-radius:10px;display:none;flex-direction:column;z-index:200;max-height:70vh;overflow:auto}
.mi{padding:9px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
.mi:hover{background:rgba(255,255,255,.1)}
.mi i{width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff}
#credit{position:absolute;bottom:54px;right:12px;font-size:11px;color:rgba(255,255,255,.4)}
</style>
</head>
<body>
<div id="desktop"></div>
<div id="status">Cargando...</div>
<div id="credit">hecho por Eduar</div>
<div id="bar"><button id="startBtn">Inicio</button><div id="clock">00:00</div></div>
<div id="menu"></div>
<script>
const juegos=[
{id:'geometrydash',n:'Geometry Dash',c:'#111',l:'GD'},
{id:'amongus',n:'Among Us',c:'#c51111',l:'AU'},
{id:'motox3m',n:'Moto X3M',c:'#e67e22',l:'MX'},
{id:'angrybirds',n:'Angry Birds',c:'#e74c3c',l:'AB'},
{id:'fruitninja',n:'Fruit Ninja',c:'#27ae60',l:'FN'},
{id:'cl2doom',n:'Doom',c:'#8b0000',l:'DM'},
{id:'cl100in1nes',n:'100 NES',c:'#2c3e50',l:'100'},
{id:'cl64in1nes',n:'64 NES',c:'#34495e',l:'64'},
{id:'cl90in1nes',n:'90 NES',c:'#1a252f',l:'90'},
{id:'fireboyandwatergirl2',n:'Fireboy',c:'#c0392b',l:'FW'},
{id:'basketbros',n:'Basket Bros',c:'#f39c12',l:'BB'},
{id:'hillclimbracinglite',n:'Hill Climb',c:'#2980b9',l:'HC'},
{id:'candycrush',n:'Candy Crush',c:'#e91e63',l:'CC'},
{id:'basketballstars',n:'Basket Stars',c:'#d35400',l:'BS'},
{id:'ducklife',n:'Duck Life',c:'#16a085',l:'DL'},
{id:'ducklife4',n:'Duck Life 4',c:'#1abc9c',l:'D4'},
{id:'chess',n:'Chess',c:'#2c3e50',l:'CH'},
{id:'awesometanks2',n:'Awesome Tanks',c:'#7f8c8d',l:'AT'},
{id:'cl10bullets',n:'10 Bullets',c:'#b71c1c',l:'10B'},
{id:'cl1morebullets',n:'More Bullets',c:'#880e4f',l:'MB'},
{id:'cl100RoomsofEnemies',n:'100 Rooms',c:'#1a237e',l:'100R'},
{id:'cl2Dshooting',n:'2D Shooting',c:'#311b92',l:'2DS'},
{id:'cl3dash',n:'3Dash',c:'#000',l:'3D'},
{id:'cl2048',n:'2048',c:'#ff9800',l:'48'},
{id:'cl8ballpool',n:'8 Ball',c:'#2e7d32',l:'8B'},
{id:'clBTD1',n:'Bloons TD',c:'#6d4c41',l:'BTD'},
{id:'clADOFAI',n:'ADOFAI',c:'#ad1457',l:'ADF'},
{id:'cl10minutestildawn',n:'10 Minutes',c:'#4a148c',l:'10M'},
{id:'cl12minibattles',n:'12 Battles',c:'#bf360c',l:'12'}
];
const desk=document.getElementById('desktop');
const menu=document.getElementById('menu');
juegos.forEach(j=>{
  const d=document.createElement('div');
  d.className='sc';
  d.onclick=()=>abrir(j.id,j.n);
  d.innerHTML='<div class="ic" style="background:'+j.c+'">'+j.l+'</div><div class="lb">'+j.n+'</div>';
  desk.appendChild(d);
  const m=document.createElement('div');
  m.className='mi';
  m.onclick=()=>abrir(j.id,j.n);
  m.innerHTML='<i style="background:'+j.c+'">'+j.l+'</i> '+j.n;
  menu.appendChild(m);
});
menu.innerHTML+='<div style="height:1px;background:rgba(255,255,255,.1);margin:4px 0"></div><div class="mi" onclick="location.reload()">Reiniciar</div><div class="mi" onclick="window.close()">Apagar</div>';
document.getElementById('startBtn').onclick=e=>{e.stopPropagation();menu.style.display=menu.style.display==='flex'?'none':'flex'};
document.body.onclick=()=>menu.style.display='none';
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),1000);
function abrir(id,title){
  const s=document.getElementById('status');
  s.style.display='block';
  s.textContent='Cargando '+title+'...';
  const base=id.startsWith('cl')?'https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/UGS-Files/':'https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/offline/';
  fetch(base+id+'.html').then(r=>r.ok?r.text():Promise.reject()).then(html=>{
    s.style.display='none';
    const g=window.open('about:blank','_blank');
    if(g){g.document.write(html);g.document.close();}
    else{s.style.display='block';s.textContent='Activa pop-ups';setTimeout(()=>s.style.display='none',2000);}
  }).catch(()=>{s.textContent='Error: '+title;setTimeout(()=>s.style.display='none',2000);});
}
</script>
</body>
</html>
